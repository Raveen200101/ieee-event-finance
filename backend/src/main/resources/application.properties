spring.application.name=event-finance
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ieee_event_finance_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.security.issuer=${JWT_ISSUER:ieee-event-finance}
app.security.audience=${JWT_AUDIENCE:ieee-event-finance-api}
app.security.private-key-path=${JWT_PRIVATE_KEY_PATH:}
app.security.public-key-path=${JWT_PUBLIC_KEY_PATH:}
app.security.access-seconds=${JWT_ACCESS_SECONDS:900}
app.security.refresh-seconds=${JWT_REFRESH_SECONDS:604800}
app.security.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.security.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.security.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
